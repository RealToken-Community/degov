services:
  postgres:
    image: postgres:17-alpine
    shm_size: 1gb
    environment:
      POSTGRES_DB: ${DEGOV_DB_NAME:-postgres}
      POSTGRES_PASSWORD: ${DEGOV_DB_PASSWORD:-postgres}
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
#    ports:
#      - "${DEGOV_DB_PORT:-5432}:5432"
    networks:
      - degov

  indexer-migrate:
    image: degov-indexer
    profiles:
      - indexer
    depends_on:
      - postgres
    build:
      context: .
      dockerfile: docker/indexer.Dockerfile
    command: migrate
    environment:
      DEGOV_INDEXER_DATABASE_URL: postgresql://postgres:${DEGOV_DB_PASSWORD:-postgres}@postgres/indexer

  indexer:
    image: degov-indexer
    profiles:
      - indexer
    depends_on:
      - postgres
    build:
      context: .
      dockerfile: docker/indexer.Dockerfile
    command: run
    volumes:
      - ./apps/indexer/indexer.example.yml:/app/indexer.yml:ro
    environment:
      DEGOV_INDEXER_DATABASE_URL: postgresql://postgres:${DEGOV_DB_PASSWORD:-postgres}@postgres/indexer
      DEGOV_INDEXER_CONFIG_FILE: ${DEGOV_INDEXER_CONFIG_FILE:-/app/indexer.yml}
      DEGOV_INDEXER_CONTRACT_SET_MODE: ${DEGOV_INDEXER_CONTRACT_SET_MODE:-all}
      DEGOV_INDEXER_DAO_CODE: ${DEGOV_INDEXER_DAO_CODE:-}
      DEGOV_INDEXER_TARGET_HEIGHT: ${DEGOV_INDEXER_TARGET_HEIGHT:-latest}
      DEGOV_INDEXER_RUN_ONCE: ${DEGOV_INDEXER_RUN_ONCE:-false}
      DEGOV_INDEXER_POLL_INTERVAL_MS: ${DEGOV_INDEXER_POLL_INTERVAL_MS:-10000}
      DATALENS_ENDPOINT: ${DATALENS_ENDPOINT:-}
      DATALENS_APPLICATION: ${DATALENS_APPLICATION:-}
      DATALENS_TOKEN: ${DATALENS_TOKEN:-}
      DATALENS_TIMEOUT_SECONDS: ${DATALENS_TIMEOUT_SECONDS:-60}
      DATALENS_FINALITY: ${DATALENS_FINALITY:-durable_only}
      DATALENS_CHAIN_FAMILY: ${DATALENS_CHAIN_FAMILY:-evm}
      DATALENS_CHAIN_NAME: ${DATALENS_CHAIN_NAME:-ethereum}
      DATALENS_CHAIN_ID: ${DATALENS_CHAIN_ID:-1}
      DATALENS_DATASET_FAMILY: ${DATALENS_DATASET_FAMILY:-evm}
      DATALENS_DATASET_NAME: ${DATALENS_DATASET_NAME:-logs}
      DATALENS_QUERY_BLOCK_RANGE_LIMIT: ${DATALENS_QUERY_BLOCK_RANGE_LIMIT:-1000}
      DATALENS_CHAINS_JSON: ${DATALENS_CHAINS_JSON:-}
      DATALENS_GOVERNOR_ADDRESS: ${DATALENS_GOVERNOR_ADDRESS:-}
      DATALENS_GOVERNOR_TOKEN_ADDRESS: ${DATALENS_GOVERNOR_TOKEN_ADDRESS:-}
      DATALENS_GOVERNOR_TOKEN_STANDARD: ${DATALENS_GOVERNOR_TOKEN_STANDARD:-}
      DATALENS_TIMELOCK_ADDRESS: ${DATALENS_TIMELOCK_ADDRESS:-}

  onchain-worker:
    image: degov-indexer
    profiles:
      - indexer
    depends_on:
      - postgres
    build:
      context: .
      dockerfile: docker/indexer.Dockerfile
#    ports:
#      - "${DEGOV_INDEXER_PORT:-4350}:4350"
    volumes:
      - ./degov.yml:/app/degov.yml
    environment:
      DB_HOST: postgres
      DB_NAME: indexer
      DB_USER: postgres
      DB_PASS: ${DEGOV_DB_PASSWORD}
      DB_PORT: 5432
      GQL_PORT: 4350
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL}
      CHAIN_RPC_1: ${CHAIN_RPC_1}
      DEGOV_CONFIG_PATH: degov.yml
      # CHAIN_RPC_10: ${CHAIN_RPC_10}
      # CHAIN_RPC_...: ${CHAIN_RPC_...}
    networks:
      - degov
      - traefik-realt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.degov-api.rule=Host(`api.degov.backup.realtoken.community`)"
#      - "traefik.http.routers.degov-api.middlewares=auth@file"
      - "traefik.http.services.degov-api.loadbalancer.server.port=4350"
    restart: unless-stopped

  web:
    image: degov-web
    depends_on:
      - postgres
    build:
      context: .
      dockerfile: docker/web.Dockerfile
#    ports:
#      - "${DEGOV_WEB_PORT:-3000}:3000"
    environment:
      JWT_SECRET_KEY: ${DEGOV_WEB_JWT_SECRET:-}
      DATABASE_URL: postgresql://postgres:${DEGOV_DB_PASSWORD:-postgres}@postgres/degov
      # DEGOV_CONFIG_PATH: degov.yml
    networks:
      - degov
      - traefik-realt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.degov-web.rule=Host(`degov.backup.realtoken.community`)"
#      - "traefik.http.routers.degov-web.middlewares=auth@file"
      - "traefik.http.services.degov-web.loadbalancer.server.port=3000"
    restart: unless-stopped

networks:
  degov:
  traefik-realt:
    external: true
